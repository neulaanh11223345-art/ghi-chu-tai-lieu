html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.zh{display:block;font-size:.78em;color:var(--sub);line-height:1.3}
.inl .zh{display:inline;margin-left:6px}
header.bar{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header.bar h1{font-size:18px;margin:0;flex:1;line-height:1.2}
header.bar h1 .zh{color:#C9D6EA}
header.bar button svg{width:20px;height:20px}

.net{font-size:12px;padding:3px 8px;border-radius:999px;background:#F59E0B;color:#1b1300;font-weight:600}
main{padding:14px 16px calc(var(--tab) + 90px + env(safe-area-inset-bottom));max-width:860px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;border:0;background:none;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--sub)}
.tab .zh{font-size:10px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--pri2);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.sec{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}

.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 8px}
.row .main{flex:1;min-width:0}

.row svg{flex:none;width:22px;height:22px;color:var(--pri2)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#EAF0FA;color:#29446B;margin:3px 4px 0 0;white-space:nowrap}

.search svg{width:20px;height:20px;color:var(--sub)}
label.f{display:block;margin:0 0 12px}

label.f>span.l .zh{display:inline;margin-left:6px;font-weight:400}
input.i,select.i,textarea.i{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px}
textarea.i{min-height:120px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{outline:0;border-color:var(--pri2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--pri2);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}

.btn.wide{width:100%}

.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fab{position:fixed;right:18px;bottom:calc(var(--tab) + 18px + env(safe-area-inset-bottom));z-index:15;border-radius:999px;box-shadow:0 6px 18px rgba(30,58,95,.28);padding:14px 18px}

.pre{white-space:pre-wrap;word-break:break-word}

table.t th{background:#EEF3FA;font-size:12px;color:#33475F}
table.t td.n{text-align:center;font-variant-numeric:tabular-nums}

.err{color:var(--bad);font-size:14px;min-height:20px}
mark{background:#FFF0A8;border-radius:3px;padding:0 1px}
@media (min-width:900px){.fab{right:calc(50% - 420px)}}

      r.onupgradeneeded = () => r.result.createObjectStore('kv');

      r.onerror = () => res();

    async get(k, d) { await this.ready; if (!db) return k in mem ? mem[k] : d; const v = await tx('readonly', (s) => s.get(k)); return v === undefined ? d : v; },
    async set(k, v) { await this.ready; if (!db) { mem[k] = v; return; } await tx('readwrite', (s) => s.put(v, k)); },
    async del(k) { await this.ready; if (!db) { delete mem[k]; return; } await tx('readwrite', (s) => s.delete(k)); }
  };
})();

const DEV = (() => { try { let d = localStorage.getItem('gctl_dev'); if (!d) { d = 'D' + Math.random().toString(36).slice(2, 12); localStorage.setItem('gctl_dev', d); } return d; } catch (e) { return 'D-nostore'; } })();

function apiUrl() { return (typeof API_URL === 'string' && API_URL) || S.api || ''; }
async function api(action, payload, opts) {
  opts = opts || {};
  const req = { action, payload: payload || {}, token: S.tk, device: DEV };
  if (opts.opId) req.opId = opts.opId;
  let j;
  if (IS_DEMO) {
    await sleep(80 + Math.random() * 120);

    j = DemoBackend.call(req);
  } else {
    const url = apiUrl();

    try {

      try { txt = await (await fetch(url, { method: 'POST', body: JSON.stringify(req), signal: ctrl.signal, redirect: 'follow' })).text(); }
      catch (e) { throw { code: 'MANG' }; }

  const m = String((e && e.message) || (e && e.code) || e), i = m.indexOf(' · ');

}

const newOp = () => 'op' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const maTuOp = (tien, op) => tien + op.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(-18);
async function saveQ() { await store.set('q', S.Q); renderBar(); }

async function ghi(action, payload, label, apDung) {
  const op = newOp();
  if (S.Q.length || S.offline) return xepHang(op, action, payload, label, apDung);
  try {
    const d = await api(action, payload, { opId: op });
    gopKetQua(action, d);
    return { ok: true, data: d };
  } catch (e) {
    if (e && e.code === 'MANG') { setOffline(true); return xepHang(op, action, payload, label, apDung); }

}
async function xepHang(op, action, payload, label, apDung) {

async function guiHangCho(tay) {
  if (S.sending || !S.Q.length || !S.tk) return;

  try {
    while (S.Q.length) {
      const q = S.Q[0];

      try {
        const d = await api(q.action, q.payload, { opId: q.op });
        gopKetQua(q.action, d);
        S.Q.shift(); await saveQ();
      } catch (e) {
        if (e && e.code === 'MANG') { setOffline(true); break; }

// Gộp kết quả máy chủ vào dữ liệu đang hiện, khỏi tải lại cả bộ
function upsert(arr, x) { const i = arr.findIndex((y) => y.id === x.id); if (i >= 0) arr[i] = x; else arr.push(x); }
function gopKetQua(action, d) {
  const D = S.data; if (!D || !d) return;
  if (d.ghiChu && !Array.isArray(d.ghiChu)) upsert(D.ghiChu, d.ghiChu);
  if (action === 'noteDelete') D.ghiChu = D.ghiChu.filter((x) => x.id !== d.id);
  if (d.taiLieu && !Array.isArray(d.taiLieu)) {
    // Bản mới đang hiệu lực thì các bản khác cùng tài liệu thôi hiệu lực (máy chủ chỉ trả về bản mới)
    if (d.taiLieu.hienHanh) D.taiLieu.forEach((x) => { if (x.maTL === d.taiLieu.maTL && x.id !== d.taiLieu.id) x.hienHanh = false; });
    upsert(D.taiLieu, d.taiLieu);
  }
  if (Array.isArray(d.taiLieu)) { const ids = d.taiLieu.map((x) => x.id); const ma = d.taiLieu[0] && d.taiLieu[0].maTL; D.taiLieu = D.taiLieu.filter((x) => x.maTL !== ma && ids.indexOf(x.id) < 0).concat(d.taiLieu); }
  if (action === 'docDelete') D.taiLieu = D.taiLieu.filter((x) => x.id !== d.id);
  if (d.nhom) { upsert(D.nhom, d.nhom); }
  if (d.day) upsert(D.dayDien, d.day);
  if (d.dayDien) D.dayDien = d.dayDien;
  if (action === 'wireDelete') D.dayDien = D.dayDien.filter((x) => x.id !== d.id);
  if (d.cauHinh) upsert(D.cauHinh, d.cauHinh);
  if (action === 'cfgDelete') D.cauHinh = D.cauHinh.filter((x) => x.id !== d.id);
  saveSnap();
}

    S.Q.forEach((q) => { if (APDUNG[q.action]) APDUNG[q.action](q.op, q.payload); });

      capNhat: new Date().toISOString().slice(0, 19).replace('T', ' '), _cho: op });

// Thu nhỏ ảnh chụp về cạnh dài 1600 px, JPEG 80%: ảnh iPhone 3–5 MB còn khoảng 300 KB, gửi được cả khi sóng yếu
function nenAnh(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res({ mime: 'image/jpeg', b64: c.toDataURL('image/jpeg', 0.8).split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

// ============ Tính toán: DPI, tần số phun, delay ============
// Công thức theo sổ tay Merlin D CE: DPI = (xung/vòng × số cạnh ÷ divider) ÷ chu vi trục (inch).
// Delay tính THẲNG từ khoảng cách (mm) rồi mới làm tròn — không nhân tỉ lệ từ số đã làm tròn như bảng cũ của nhà cung cấp
// (cách đó nhân sai số làm tròn lên, lệch tới 6 chấm ≈ 1,4 mm ở 112 dpi).
function tinh(c) {
  const chuVi = c.duongKinh / 25.4 * Math.PI, dpi = c.encoderPPR * c.soCanh / c.divider / chuVi;
  const chamSP = c.daiSP / 25.4 * dpi, f = chamSP * c.tocDo / 60, mPhut = c.daiSP / 1000 * c.tocDo;
  const toiDa = chamSP > 0 ? c.gioiHan * 1000 / chamSP * 60 : 0;
  const dpiMax = c.tocDo > 0 ? c.gioiHan * 1000 / (c.daiSP / 25.4 * c.tocDo / 60) : Infinity;
  const divMin = Math.ceil(c.encoderPPR * c.soCanh / chuVi / dpiMax - 1e-9);
  const tre = (mm) => Math.round(mm / 25.4 * dpi);
  const delay = [];
  for (let n = 0; n < 4; n++) delay.push({ k: 'PB1-' + (n + 1), mm: n * c.khoangJA, d: tre(n * c.khoangJA) });
  for (let n = 0; n < 4; n++) { const mm = 3 * c.khoangJA + c.khoangPB + c.buPB + n * c.khoangJA; delay.push({ k: 'PB2-' + (n + 1), mm, d: tre(mm) }); }
  const muc = f <= c.gioiHan * 1000 ? 'ok' : f <= 20000 ? 'warn' : 'bad';
  return { dpi, mmCham: 25.4 / dpi, f, mPhut, toiDa, divMin, delay, muc };
}

const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = (u8) => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
// Gói zip kiểu "store" (không nén): file Excel vài trăm KB, đủ nhỏ và Excel/WPS/Numbers đều mở được
function zip(files) {
  const enc = new TextEncoder(), parts = [], dir = []; let off = 0;
  files.forEach(([name, text]) => {
    const n = enc.encode(name), d = enc.encode(text), c = crc32(d), h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint32(14, c, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true); h.setUint16(26, n.length, true);

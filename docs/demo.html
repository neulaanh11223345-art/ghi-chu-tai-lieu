<title>Ghi chú & Tài liệu · 笔记与资料</title>
<style>
:root{--bg:#F3F6FB;--card:#fff;--ink:#14213D;--sub:#5B6B82;--line:#DCE3EE;--pri:#1E3A5F;--pri2:#2F6FDB;--ok:#16794C;--okbg:#E3F5EC;
--warn:#A65B00;--warnbg:#FFF1DD;--bad:#B42318;--badbg:#FDE8E7;--r:14px;--tab:64px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.zh{display:block;font-size:.78em;color:var(--sub);line-height:1.3}
.inl .zh{display:inline;margin-left:6px}
header.bar{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header.bar h1{font-size:18px;margin:0;flex:1;line-height:1.2}
header.bar h1 .zh{color:#C9D6EA}
header.bar button svg{width:20px;height:20px}
header.bar button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:6px}
.net{font-size:12px;padding:3px 8px;border-radius:999px;background:#F59E0B;color:#1b1300;font-weight:600}
main{padding:14px 16px calc(var(--tab) + 90px + env(safe-area-inset-bottom));max-width:860px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;border:0;background:none;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--sub)}
.tab .zh{font-size:10px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--pri2);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.sec{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec .zh{display:inline;margin-left:6px;text-transform:none}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 8px}
.row .main{flex:1;min-width:0}
.row .nm{font-weight:600;word-break:break-word}
.row .sub{font-size:13px;color:var(--sub);margin-top:2px;word-break:break-word}
.row svg{flex:none;width:22px;height:22px;color:var(--pri2)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#EAF0FA;color:#29446B;margin:3px 4px 0 0;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)} .chip.bad{background:var(--badbg);color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chips button.on .zh{color:#C9D6EA}
.search{display:flex;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.search:focus-within{border-color:var(--pri2)}
.search input{flex:1;border:0;outline:0;background:none;font-size:17px;min-width:0}
.search svg{width:20px;height:20px;color:var(--sub)}
label.f{display:block;margin:0 0 12px}
label.f>span.l{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
label.f>span.l .zh{display:inline;margin-left:6px;font-weight:400}
input.i,select.i,textarea.i{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px}
textarea.i{min-height:120px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{outline:0;border-color:var(--pri2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--pri2);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn .zh{color:#DCE7FF;display:inline;margin-left:4px;font-weight:400}
.btn.ghost{background:#EAF0FA;color:var(--pri)} .btn.ghost .zh{color:#4D6587}
.btn.bad{background:var(--badbg);color:var(--bad)} .btn.bad .zh{color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fab{position:fixed;right:18px;bottom:calc(var(--tab) + 18px + env(safe-area-inset-bottom));z-index:15;border-radius:999px;box-shadow:0 6px 18px rgba(30,58,95,.28);padding:14px 18px}
.empty{text-align:center;color:var(--sub);padding:28px 10px}
.muted{color:var(--sub);font-size:13px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.pre{white-space:pre-wrap;word-break:break-word}
.zhbox{background:#F6F8FC;border-left:3px solid #9DB4D8;padding:8px 10px;border-radius:6px;margin-top:8px;color:#33475F}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs .th{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:#E5EAF2;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .x{position:absolute;top:2px;right:2px;border:0;border-radius:999px;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:24px;padding:0}
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,20,35,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet .hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.sheet .hd h2{flex:1;font-size:18px;margin:0}
.sheet .hd button{border:0;background:#E5EAF2;border-radius:999px;width:34px;height:34px;font-size:18px;flex:none}
#viewer{position:fixed;inset:0;z-index:50;background:#1c2533;display:flex;flex-direction:column}
#viewer .vb{display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;color:#fff}
#viewer .vb .t{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer .vb a,#viewer .vb button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:7px 10px;font-size:14px;text-decoration:none}
#viewer iframe,#viewer img{flex:1;width:100%;border:0;background:#fff;object-fit:contain}
#viewer .nov{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;bottom:calc(var(--tab) + 86px + env(safe-area-inset-bottom));z-index:60;background:#14213D;color:#fff;border-radius:12px;padding:10px 14px;max-width:92%;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast .zh{color:#B9C6DB}
.toast.bad{background:var(--bad)} .toast.bad .zh{color:#FFD7D3}
table.t{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:10px;overflow:hidden}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{background:#EEF3FA;font-size:12px;color:#33475F}
table.t td.n{text-align:center;font-variant-numeric:tabular-nums}
table.t td.n b{font-size:17px}
#rDelay th{text-align:center}
.big{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .k{font-size:12px;color:var(--sub)}
.kpi.ok{border-color:#9BD3B5;background:var(--okbg)} .kpi.warn{border-color:#F3C37E;background:var(--warnbg)} .kpi.bad{border-color:#F3A29B;background:var(--badbg)}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#1E3A5F,#2F6FDB)}
.login .box{background:#fff;border-radius:20px;padding:22px 20px;width:100%;max-width:340px;text-align:center}
.login h1{font-size:20px;margin:4px 0 2px}
.dots{display:flex;justify-content:center;gap:12px;margin:18px 0 6px}
.dots i{width:14px;height:14px;border-radius:999px;border:2px solid var(--pri2)}
.dots i.on{background:var(--pri2)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.keypad button{border:0;background:#EEF3FA;border-radius:14px;padding:14px 0;font-size:22px;font-weight:600}
.err{color:var(--bad);font-size:14px;min-height:20px}
mark{background:#FFF0A8;border-radius:3px;padding:0 1px}
@media (min-width:900px){.fab{right:calc(50% - 420px)}}
</style>

<script>
const API_URL = "";
const MODE = "demo";
const APP_VER = "1.0.0";
const DemoBackend = (function () {
// ===== Giả lập dịch vụ Google Apps Script (dùng cho bản xem thử và kiểm tra) =====
// SpreadsheetApp, CacheService, LockService, PropertiesService, Utilities,
// ContentService, MailApp, UrlFetchApp, ScriptApp, Session.
var __clock = { off: 0 };               // lệch giờ giả (ms), để kiểm tra
var __tz = { off: 7 * 3600000 };         // múi giờ của formatDate (mặc định +07:00)
var __mail = [];                         // thư đã gửi
var __net = { log: [], reply: null };    // yêu cầu mạng đã gửi; reply(url, opt) để giả trả lời
var __triggers = [];

var SpreadsheetApp = (function () {
  function Sheet(name) {
    this.name = name; this.data = []; this.fmt = {}; this.maxRows = 1000; this.maxCols = 26; this.frozen = 0;
  }
  Sheet.prototype.getName = function () { return this.name; };
  Sheet.prototype.getLastRow = function () {
    for (var i = this.data.length - 1; i >= 0; i--) {
      var r = this.data[i];
      if (r && r.some(function (v) { return v !== '' && v !== null && v !== undefined; })) return i + 1;
    }
    return 0;
  };
  Sheet.prototype.getMaxRows = function () { return this.maxRows; };
  Sheet.prototype.getMaxColumns = function () { return this.maxCols; };
  Sheet.prototype.insertColumnsAfter = function (after, n) { this.maxCols += n; return this; };
  Sheet.prototype.insertRowsAfter = function (after, n) { this.maxRows += n; return this; };
  Sheet.prototype.setFrozenRows = function (n) { this.frozen = n; return this; };
  Sheet.prototype.setColumnWidth = function () { return this; };
  Sheet.prototype.autoResizeColumns = function () { return this; };
  Sheet.prototype.appendRow = function (arr) {
    var r = this.getLastRow() + 1; if (r > this.maxRows) this.maxRows = r;
    this.getRange(r, 1, 1, arr.length).setValues([arr]); return this;
  };
  Sheet.prototype.getRange = function (row, col, nr, nc) {
    if (typeof row === 'string') throw new Error('A1 notation not supported in mock');
    nr = nr || 1; nc = nc || 1;
    if (row < 1 || col < 1 || row + nr - 1 > this.maxRows || col + nc - 1 > this.maxCols) {
      throw new Error('Range outside sheet: ' + row + ',' + col + ',' + nr + ',' + nc);
    }
    return new Range(this, row, col, nr, nc);
  };
  Sheet.prototype.getDataRange = function () {
    return this.getRange(1, 1, Math.max(1, this.getLastRow()), this.maxCols);
  };
  Sheet.prototype.setName = function (n) { this.name = n; return this; };
  Sheet.prototype.clearContents = function () { this.data = []; return this; };
  Sheet.prototype.clear = Sheet.prototype.clearContents;
  // Chép trang sang file khác (giống Google: tên "Bản sao của …")
  Sheet.prototype.copyTo = function (book) {
    var t = book.insertSheet('Bản sao của ' + this.name);
    t.data = this.data.map(function (r) { return (r || []).map(function (v) { return v instanceof Date ? new Date(v.getTime()) : v; }); });
    t.fmt = Object.assign({}, this.fmt); t.maxRows = this.maxRows; t.maxCols = this.maxCols; t.frozen = this.frozen;
    return t;
  };

  function Range(sh, r, c, nr, nc) { this.sh = sh; this.r = r; this.c = c; this.nr = nr; this.nc = nc; }
  Range.prototype.getValues = function () {
    var out = [];
    for (var i = 0; i < this.nr; i++) {
      var row = this.sh.data[this.r - 1 + i] || [];
      var o = [];
      for (var j = 0; j < this.nc; j++) {
        var v = row[this.c - 1 + j];
        o.push(v === undefined || v === null ? '' : v);
      }
      out.push(o);
    }
    return out;
  };
  Range.prototype.getValue = function () { return this.getValues()[0][0]; };
  Range.prototype.clearContent = function () {
    for (var i = 0; i < this.nr; i++) { var row = this.sh.data[this.r - 1 + i]; if (!row) continue; for (var j = 0; j < this.nc; j++) row[this.c - 1 + j] = ''; }
    return this;
  };
  Range.prototype.setValues = function (vals) {
    if (vals.length !== this.nr) throw new Error('Row count mismatch');
    for (var i = 0; i < this.nr; i++) {
      if (vals[i].length !== this.nc) throw new Error('Column count mismatch');
      var ri = this.r - 1 + i;
      while (this.sh.data.length <= ri) this.sh.data.push([]);
      for (var j = 0; j < this.nc; j++) {
        var v = vals[i][j];
        if (typeof v === 'string' && v.charAt(0) === "'") v = v.slice(1); // dấu ' = ghi chữ
        // Giống Google Sheets: ô không định dạng chữ mà ghi 'yyyy-mm-dd' thì thành ngày
        var f = this.sh.fmt[this.c + j];
        if (typeof v === 'string' && f !== '@' && /^\d{4}-\d{2}-\d{2}$/.test(v)) {
          v = new Date(v + 'T00:00:00+07:00');
        }
        this.sh.data[ri][this.c - 1 + j] = v;
      }
    }
    return this;
  };
  Range.prototype.setValue = function (v) {
    var a = []; for (var i = 0; i < this.nr; i++) { var r = []; for (var j = 0; j < this.nc; j++) r.push(v); a.push(r); }
    return this.setValues(a);
  };
  Range.prototype.setNumberFormat = function (f) {
    for (var j = 0; j < this.nc; j++) this.sh.fmt[this.c + j] = f;
    return this;
  };
  Range.prototype.setNumberFormats = function (fs) {
    for (var j = 0; j < this.nc; j++) if (!this.sh.fmt[this.c + j]) this.sh.fmt[this.c + j] = fs[0][j];
    return this;
  };
  ['setFontWeight', 'setBackground', 'setFontColor', 'setWrap', 'setHorizontalAlignment',
    'setVerticalAlignment', 'setFontSize'].forEach(function (k) {
    Range.prototype[k] = function () { return this; };
  });

  function Book(id, name) { this.id = id; this.nm = name; this.sheets = []; }
  Book.prototype.getSheetByName = function (n) { for (var i = 0; i < this.sheets.length; i++) if (this.sheets[i].name === n) return this.sheets[i]; return null; };
  Book.prototype.insertSheet = function (n) { var s = new Sheet(n); this.sheets.push(s); return s; };
  Book.prototype.getSheets = function () { return this.sheets.slice(); };
  Book.prototype.deleteSheet = function (sh) { if (this.sheets.length < 2) throw new Error('Cannot delete the only sheet'); this.sheets = this.sheets.filter(function (x) { return x !== sh; }); };
  Book.prototype.getName = function () { return this.nm; };
  Book.prototype.getId = function () { return this.id; };
  Book.prototype.getUrl = function () { return 'https://docs.google.com/spreadsheets/d/' + this.id; };
  var ss = new Book('demo-sheet', 'Ghi chú & Tài liệu'), books = {};
  return {
    getActive: function () { return ss; },
    getActiveSpreadsheet: function () { return ss; },
    create: function (name) {
      var id = 'SS' + Math.random().toString(36).slice(2, 14), b = new Book(id, name);
      b.insertSheet('Trang tính1'); books[id] = b;
      DriveApp.__addFile(id, name, 'application/vnd.google-apps.spreadsheet');
      return b;
    },
    openById: function (id) { if (!books[id]) throw new Error('Spreadsheet not found'); return books[id]; },
    __books: books,
    __reset: function () { ss.sheets = []; Object.keys(books).forEach(function (k) { delete books[k]; }); }
  };
})();

var CacheService = (function () {
  var store = {};
  var c = {
    get: function (k) { var o = store[k]; if (!o) return null; if (o.exp < Date.now() + __clock.off) { delete store[k]; return null; } return o.v; },
    put: function (k, v, sec) { store[k] = { v: String(v), exp: Date.now() + __clock.off + (sec || 600) * 1000 }; },
    remove: function (k) { delete store[k]; },
    __clear: function () { store = {}; }
  };
  return { getScriptCache: function () { return c; } };
})();

var LockService = (function () {
  var l = { tryLock: function () { return true; }, waitLock: function () {}, releaseLock: function () {} };
  return { getScriptLock: function () { return l; } };
})();

var PropertiesService = (function () {
  var p = {};
  var sp = {
    getProperty: function (k) { return Object.prototype.hasOwnProperty.call(p, k) ? p[k] : null; },
    setProperty: function (k, v) { p[k] = String(v); return sp; },
    deleteProperty: function (k) { delete p[k]; return sp; },
    getProperties: function () { return Object.assign({}, p); },
    __clear: function () { p = {}; }
  };
  return { getScriptProperties: function () { return sp; } };
})();

var Utilities = (function () {
  // SHA-256 thuần JS (đồng bộ)
  var K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  function utf8(s) { return Array.from(new TextEncoder().encode(String(s))); }
  function sha256(bytes) {
    var H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    var m = bytes.slice(); var bl = bytes.length * 8;
    m.push(0x80); while (m.length % 64 !== 56) m.push(0);
    for (var i = 7; i >= 0; i--) m.push(Math.floor(bl / Math.pow(2, i * 8)) & 255);
    var w = new Array(64);
    for (var o = 0; o < m.length; o += 64) {
      for (var t = 0; t < 16; t++) w[t] = (m[o + t * 4] << 24) | (m[o + t * 4 + 1] << 16) | (m[o + t * 4 + 2] << 8) | m[o + t * 4 + 3];
      for (t = 16; t < 64; t++) {
        var x = w[t - 15], y = w[t - 2];
        var s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
        var s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
        w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
      }
      var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (t = 0; t < 64; t++) {
        var S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
        var ch = (e & f) ^ (~e & g);

function upsert(arr, x) { const i = arr.findIndex((y) => y.id === x.id); if (i >= 0) arr[i] = x; else arr.push(x); }
function gopKetQua(action, d) {
  const D = S.data; if (!D || !d) return;
  if (d.ghiChu && !Array.isArray(d.ghiChu)) upsert(D.ghiChu, d.ghiChu);
  if (action === 'noteDelete') D.ghiChu = D.ghiChu.filter((x) => x.id !== d.id);
  if (d.taiLieu && !Array.isArray(d.taiLieu)) {
    // Bản mới đang hiệu lực thì các bản khác cùng tài liệu thôi hiệu lực (máy chủ chỉ trả về bản mới)
    if (d.taiLieu.hienHanh) D.taiLieu.forEach((x) => { if (x.maTL === d.taiLieu.maTL && x.id !== d.taiLieu.id) x.hienHanh = false; });
    upsert(D.taiLieu, d.taiLieu);
  }
  if (Array.isArray(d.taiLieu)) { const ids = d.taiLieu.map((x) => x.id); const ma = d.taiLieu[0] && d.taiLieu[0].maTL; D.taiLieu = D.taiLieu.filter((x) => x.maTL !== ma && ids.indexOf(x.id) < 0).concat(d.taiLieu); }
  if (action === 'docDelete') D.taiLieu = D.taiLieu.filter((x) => x.id !== d.id);
  if (d.nhom) { upsert(D.nhom, d.nhom); }
  if (d.day) upsert(D.dayDien, d.day);
  if (d.dayDien) D.dayDien = d.dayDien;
  if (action === 'wireDelete') D.dayDien = D.dayDien.filter((x) => x.id !== d.id);
  if (d.cauHinh) upsert(D.cauHinh, d.cauHinh);
  if (action === 'cfgDelete') D.cauHinh = D.cauHinh.filter((x) => x.id !== d.id);
  saveSnap();
}
async function refresh(im) {
  try {
    const d = await api('data');
    S.data = d; await saveSnap();
    // Thao tác còn trong hàng chờ: áp lại lên dữ liệu mới để không "biến mất" trên màn hình
    S.Q.forEach((q) => { if (APDUNG[q.action]) APDUNG[q.action](q.op, q.payload); });
    if (!im) render();
  } catch (e) {
    if (e && e.code === 'MANG') setOffline(true);
    else if (!im) toast(errMsg(e), true);
  }
}

      capNhat: new Date().toISOString().slice(0, 19).replace('T', ' '), _cho: op });

function tenNhom(id) { const n = ((S.data && S.data.nhom) || []).find((x) => x.id === id); return n ? n.ten + ' · ' + n.tenZh : ''; }

function tlNhom() {
  const by = {};
  S.data.taiLieu.forEach((x) => { (by[x.maTL] = by[x.maTL] || []).push(x); });
  return Object.keys(by).map((k) => {

function hl(t, q) {
  t = esc(t); const ws = norm(q).split(' ').filter((w) => w.length > 1); if (!ws.length) return t;
  // Đánh dấu chữ khớp (so trên chữ đã bỏ dấu để "loc" khớp "lọc")
  const n = norm(t); let out = '', i = 0;

}

// Thu nhỏ ảnh chụp về cạnh dài 1600 px, JPEG 80%: ảnh iPhone 3–5 MB còn khoảng 300 KB, gửi được cả khi sóng yếu
function nenAnh(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res({ mime: 'image/jpeg', b64: c.toDataURL('image/jpeg', 0.8).split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

// Đọc .xlsx: giải nén (deflate) bằng DecompressionStream có sẵn trong trình duyệt, lấy trang tính đầu tiên
async function giaiNen(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf), out = {};
  let e = u8.length - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('Không phải file .xlsx · 不是xlsx文件');
  let p = dv.getUint32(e + 16, true); const n = dv.getUint16(e + 10, true), dec = new TextDecoder();
  for (let i = 0; i < n; i++) {
    const meth = dv.getUint16(p + 10, true), csz = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl)); p += 46 + nl + xl + cl;
    if (!/^xl\/(sharedStrings\.xml|worksheets\/sheet\d+\.xml|workbook\.xml)$/.test(name)) continue;
    const ds = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true), data = u8.subarray(ds, ds + csz);
    if (meth === 0) out[name] = dec.decode(data);
    else if (meth === 8) out[name] = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();

}
async function docXlsx(buf) {
  const f = await giaiNen(buf), dp = new DOMParser();
  const ss = f['xl/sharedStrings.xml'] ? Array.from(dp.parseFromString(f['xl/sharedStrings.xml'], 'application/xml').getElementsByTagName('si')).map((si) => Array.from(si.getElementsByTagName('t')).map((t) => t.textContent).join('')) : [];
  const ten = Object.keys(f).filter((k) => /worksheets\/sheet\d+\.xml$/.test(k)).sort((a, b) => Number(a.match(/(\d+)\.xml$/)[1]) - Number(b.match(/(\d+)\.xml$/)[1]))[0];
  if (!ten) throw new Error('File không có trang tính · 文件没有工作表');
  const doc = dp.parseFromString(f[ten], 'application/xml'), rows = [];
  Array.from(doc.getElementsByTagName('row')).forEach((r) => {
    const out = [];
    Array.from(r.getElementsByTagName('c')).forEach((c) => {
      const ref = c.getAttribute('r') || '', col = ref.replace(/\d+/g, '').split('').reduce((s, ch) => s * 26 + ch.charCodeAt(0) - 64, 0) - 1, t = c.getAttribute('t');
      const v = c.getElementsByTagName('v')[0];
      let val = t === 's' ? ss[Number(v && v.textContent)] : t === 'inlineStr' ? Array.from(c.getElementsByTagName('t')).map((x) => x.textContent).join('') : (v ? v.textContent : '');
      out[col >= 0 ? col : out.length] = val === undefined ? '' : val;
    });
    rows[Number(r.getAttribute('r') || rows.length + 1) - 1] = out;
  });
  return rows.filter(Boolean);
}
async function luuFile(blob, name) {
  // iPhone: chia sẻ ra Tệp/Zalo/WeChat; máy tính: tải về
  try {
    const f = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [f] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) { await navigator.share({ files: [f], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

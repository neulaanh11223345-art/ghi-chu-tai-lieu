    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>',
    '<< /Length ' + luong.length + ' >>\nstream\n' + luong + 'endstream',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'
  ];

  for (i = 0; i < vat.length; i++) { o.push(noi.length); noi += (i + 1) + ' 0 obj\n' + vat[i] + '\nendobj\n'; }
  var xref = noi.length;

  o.forEach(function (n) { noi += ('000000000' + n).slice(-10) + ' 00000 n \n'; });

// ============ Lưu trên máy: IndexedDB (hàng chờ kèm ảnh/tệp, bản sao dữ liệu, tài liệu xem khi mất mạng) ============
const store = (() => {
  let db = null; const mem = {};
  const open = () => new Promise((res) => {
    try {
      const r = indexedDB.open('gctl', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { db = r.result; res(); };
      r.onerror = () => res();
    } catch (e) { res(); }
  });
  const tx = (mode, fn) => new Promise((res, rej) => {
    if (!db) { res(fn(null)); return; }
    const t = db.transaction('kv', mode), st = t.objectStore('kv'); let out;
    const r = fn(st); if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
  });
  return {
    ready: open(),
    async get(k, d) { await this.ready; if (!db) return k in mem ? mem[k] : d; const v = await tx('readonly', (s) => s.get(k)); return v === undefined ? d : v; },
    async set(k, v) { await this.ready; if (!db) { mem[k] = v; return; } await tx('readwrite', (s) => s.put(v, k)); },
    async del(k) { await this.ready; if (!db) { delete mem[k]; return; } await tx('readwrite', (s) => s.delete(k)); }
  };
})();

function tachFileDay(sheets, doc) {

// v1.7: ô tìm của màn Chương trình nhận hai kiểu:
//  - gõ địa chỉ (X1, M570, D120) → tra ĐÚNG TÊN như cũ;
//  - gõ chữ mô tả ("cảm biến", "传感器") → tìm theo nội dung: ghi chú của bạn (tiếng Việt / Trung) và chú thích trong bảng.
//    Bảng PLC viết tiếng Trung nên chữ tiếng Việt được dịch sang tiếng Trung trước (nhớ lại để lần sau / lúc mất mạng khỏi dịch),
//    và cho sửa chữ Trung nếu Google dịch ra từ khác với từ trong bảng (vd 感应器 / 传感器).
// Gõ liền một cụm có chữ số (X1, M570, D120, TEST-201) = tra địa chỉ; có dấu cách, không có số hoặc có chữ Trung = tìm theo chữ
const laTimDiaChi = (q) => { const t = String(q).trim(); return !!t && !/\s/.test(t) && /\d/.test(t) && !/[\u4e00-\u9fff]/.test(t); };
// Ô trong bảng trông như địa chỉ PLC (để tìm ô địa chỉ nằm cạnh chú thích)
const oDiaChi = (v) => /^[A-Z]{1,3}\d[0-9A-F.]*$/i.test(String(v).trim());
const coChuTrung = (t) => /[一-鿿]/.test(t);
let TU_DICH = null;
function tuDich() { if (!TU_DICH) { try { TU_DICH = JSON.parse(localStorage.getItem('gctl_tudich') || '{}') || {}; } catch (e) { TU_DICH = {}; } } return TU_DICH; }
function nhoTuDich(vi, zh) { tuDich()[norm(vi)] = zh; try { localStorage.setItem('gctl_tudich', JSON.stringify(TU_DICH)); } catch (e) { /* bỏ qua */ } }
// Tìm chữ (tiếng Trung hoặc chữ Latin) trong ô chú thích; kết quả là ô địa chỉ cạnh đó + chú thích
function plcTimChu(cv, chu, toiDa) {
  const p = PLC.nap[cv]; if (!p || !chu) return [];
  const can = String(chu).toLowerCase(), out = [], daCo = {};
  p.sheets.forEach((sh, si) => sh.rows.forEach((row, ri) => {
    row.forEach((v, ti) => {
      if (out.length >= (toiDa || 100) || !v || !laChu(v) || String(v).toLowerCase().indexOf(can) < 0) return;
      let ci = -1;
      for (let d = 1; d <= 3 && ci < 0; d++) { if (row[ti - d] && oDiaChi(row[ti - d])) ci = ti - d; else if (row[ti + d] && oDiaChi(row[ti + d])) ci = ti + d; }
      const k = cv + '|' + (ci >= 0 ? chuanDC(row[ci]) : si + ':' + ri) + '|' + v;
      if (daCo[k]) return; daCo[k] = 1;

function veKqChu(box, cv, q) {

  if (!PLC.nap[cv]) { box.innerHTML = o + `<div class="card empty">${L('Đang đọc bảng…', '正在读取…')}</div>`; return; }
  const oZh = coChuTrung(q) ? '' : `<div class="card" id="plcZh"><label class="f" style="margin:0"><span class="l">${L('Tìm trong bảng bằng chữ Trung', '在表中按中文搜索')}${zh ? ' · ' + L('dịch từ "' + esc(q) + '"', '译自"' + esc(q) + '"').replace(/<[^>]+>/g, ' ') : ''}</span>

      if (norm(S.pq || '') !== norm(q) || S.offline) { if (S.offline) { const e = $('#pqZh'); if (e) e.placeholder = L('Mất mạng — gõ chữ Trung vào đây', '离线 — 请在此输入中文').replace(/<[^>]+>/g, ' '); } return; }
      try {
        const d = await api('translate', { text: q });
        const t = String(d.dich || '').trim();
        if (t && coChuTrung(t) && !/演示版/.test(t)) { nhoTuDich(q, t); if (norm(S.pq || '') === norm(q)) veKqPLC(); }

  const ten = Object.keys(f).filter((k) => /worksheets\/sheet\d+\.xml$/.test(k)).sort((a, b) => Number(a.match(/(\d+)\.xml$/)[1]) - Number(b.match(/(\d+)\.xml$/)[1]))[0];

      const v = c.getElementsByTagName('v')[0];
      let val = t === 's' ? ss[Number(v && v.textContent)] : t === 'inlineStr' ? Array.from(c.getElementsByTagName('t')).map((x) => x.textContent).join('') : (v ? v.textContent : '');
      out[col >= 0 ? col : out.length] = val === undefined ? '' : val;
    });

}
async function luuFile(blob, name) {
  // iPhone: chia sẻ ra Tệp/Zalo/WeChat; máy tính: tải về
  try {
    const f = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [f] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) { await navigator.share({ files: [f], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

const urlMinh = () => location.href.split('#')[0].split('?')[0];
// App này ghi chuyền là "01", "09"… (hiện "Chuyền 01"); app Bảo dưỡng ghi "VKY01". Mã toàn số thì thêm VKY
// và đủ hai chữ số; mã đã có chữ (VKY01, M001, H2506) giữ nguyên.
const maCmms = (ma) => { const m = String(ma || '').trim().replace(/^chuy[eề]n\s*/i, ''); return /^\d{1,3}$/.test(m) ? 'VKY' + m.padStart(2, '0') : m; };
function linkCmms(ma) {
  const b = cmmsUrl(), m = maCmms(ma);
  if (!b || !m) return '';
  try { const u = new URL(b); u.searchParams.set('m', m); u.searchParams.set('gc', urlMinh()); return u.href; } catch (e) { return ''; }
}
// Nút / chip mở thẳng màn đó bên app Bảo dưỡng. Chưa nối thì không hiện gì.
const nutCmms = (ma) => { const h = linkCmms(ma); return h ? `<a class="btn sm ghost cmms" href="${esc(h)}" target="_blank" rel="noopener">${IC.link}${L('Mở bên app Bảo dưỡng', '在保养APP中打开')}</a>` : ''; };
const chipMay = (ma) => { const h = linkCmms(ma); return h ? `<a class="chip cmms" href="${esc(h)}" target="_blank" rel="noopener">${T.maMay[0]}: ${esc(ma)} ↗</a>` : `<span class="chip">${T.maMay[0]}: ${esc(ma)}</span>`; };
function cmmsForm() {
  sheet(L('Nối với app Bảo dưỡng', '连接保养APP'), `<div class="card">
    <p class="muted" style="margin:0 0 10px">${L('Dán địa chỉ app Bảo dưỡng (CMMS) đang mở trên điện thoại này. Từ đó mã chuyền, mã máy trong ghi chú bấm vào là mở thẳng màn đó bên app Bảo dưỡng. Chỉ lưu trên máy này.',
      '粘贴本手机上保养APP（CMMS）的地址。之后备注中的产线、设备编号可直接点开保养APP对应页面。仅保存在本机。')}</p>
    <label class="f"><span class="l">${L('Địa chỉ app Bảo dưỡng', '保养APP地址')}</span><input class="i mono" id="cmmsIn" value="${esc(cmmsUrl())}" placeholder="https://…/B-o-d-ng/" autocomplete="off"></label>
    <div id="cmmsErr" style="color:var(--bad)"></div></div>
    <div class="btns"><button class="btn" data-act="cmmsLuu">${L(T.luu ? T.luu[0] : 'Lưu', T.luu ? T.luu[1] : '保存')}</button>
    ${cmmsUrl() ? `<button class="btn bad" data-act="cmmsBo">${L('Bỏ nối', '取消连接')}</button>` : ''}</div>`);
}
Object.assign(ACT, {
  cmmsForm,
  cmmsLuu: () => {
    const v = $('#cmmsIn').value.trim();
    if (!linkHopLe(v)) { $('#cmmsErr').textContent = 'Địa chỉ phải bắt đầu bằng https:// · 地址须以 https:// 开头'; return; }
    datCmms(v); closeSheet(); toast(L('Đã nối với app Bảo dưỡng', '已连接保养APP')); render();
  },
  cmmsBo: () => { datCmms(''); closeSheet(); toast(L('Đã bỏ nối', '已取消连接')); render(); }
});

// ============ Khởi động ============
(async function khoiDong() {
  const m = /[?&]api=([^&]+)/.exec(location.search);
  // App Bảo dưỡng mở sang: ?tim=VKY01 → vào thẳng màn Tìm; &cmms= → nhớ địa chỉ để bấm ngược lại
  try {
    const qs = new URLSearchParams(location.search), cm = qs.get('cmms'), tim = qs.get('tim');
    if (cm && linkHopLe(cm)) datCmms(cm);
    if (tim) { S.q = tim.slice(0, 60); S.view = 'tim'; }
  } catch (e) { /* bỏ qua */ }
  S.api = await store.get('api', '');
  if (m && !(typeof API_URL === 'string' && API_URL)) { S.api = decodeURIComponent(m[1]); await store.set('api', S.api); }
  S.tk = await store.get('tk', '');
  S.Q = await store.get('q', []);
  S.offDocs = await store.get('offDocs', {});
  S.lanCuoi = await store.get('lanCuoi', 0);
  if (S.tk) { S.data = await store.get('snap', null); render(); await guiHangCho(); await refresh(); if (S.data) plcNap(); }
  else render();
  if (!IS_DEMO && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>

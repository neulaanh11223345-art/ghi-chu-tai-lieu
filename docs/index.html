// ============ Lưu trên máy: IndexedDB (hàng chờ kèm ảnh/tệp, bản sao dữ liệu, tài liệu xem khi mất mạng) ============
const store = (() => {
  let db = null; const mem = {};
  const open = () => new Promise((res) => {
    try {
      const r = indexedDB.open('gctl', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { db = r.result; res(); };
      r.onerror = () => res();
    } catch (e) { res(); }
  });
  const tx = (mode, fn) => new Promise((res, rej) => {
    if (!db) { res(fn(null)); return; }
    const t = db.transaction('kv', mode), st = t.objectStore('kv'); let out;
    const r = fn(st); if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
  });
  return {
    ready: open(),
    async get(k, d) { await this.ready; if (!db) return k in mem ? mem[k] : d; const v = await tx('readonly', (s) => s.get(k)); return v === undefined ? d : v; },
    async set(k, v) { await this.ready; if (!db) { mem[k] = v; return; } await tx('readwrite', (s) => s.put(v, k)); },
    async del(k) { await this.ready; if (!db) { delete mem[k]; return; } await tx('readwrite', (s) => s.delete(k)); }
  };
})();

  if (opts.opId) req.opId = opts.opId;

  if (IS_DEMO) {
    await sleep(80 + Math.random() * 120);
    if (S.simOff) throw { code: 'MANG' };
    j = DemoBackend.call(req);
  } else {
    const url = apiUrl();
    if (!url) throw { code: 'CHUA_CAI' };
    const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), (opts.timeout || 60) * 1000);
    try {
      let txt;
      // Gửi dạng text (không đặt Content-Type JSON) để trình duyệt không gửi preflight — Apps Script không trả lời preflight
      try { txt = await (await fetch(url, { method: 'POST', body: JSON.stringify(req), signal: ctrl.signal, redirect: 'follow' })).text(); }
      catch (e) { throw { code: 'MANG' }; }
      try { j = JSON.parse(txt); } catch (e) { throw { code: /accounts\.google\.com|signin/i.test(txt) ? 'CAN_QUYEN' : 'MANG' }; }
    } finally { clearTimeout(to); }
  }
  setOffline(false);
  if (!j || !j.ok) {
    const e = { code: (j && j.code) || 'LOI', message: j && j.message };
    if (e.code === 'HET_PHIEN' && action !== 'login') setTimeout(() => logout(), 0);
    throw e;
  }
  return j.data;
}

async function ghi(action, payload, label, apDung) {
  const op = newOp();
  if (S.Q.length || S.offline) return xepHang(op, action, payload, label, apDung);
  try {
    const d = await api(action, payload, { opId: op });
    gopKetQua(action, d);
    return { ok: true, data: d };
  } catch (e) {
    if (e && e.code === 'MANG') { setOffline(true); return xepHang(op, action, payload, label, apDung); }

async function guiHangCho(tay) {
  if (S.sending || !S.Q.length || !S.tk) return;
  S.sending = true; renderBar();
  try {
    while (S.Q.length) {
      const q = S.Q[0];
      if (q.err && !tay) break;
      try {
        const d = await api(q.action, q.payload, { opId: q.op });
        gopKetQua(q.action, d);
        S.Q.shift(); await saveQ();
      } catch (e) {
        if (e && e.code === 'MANG') { setOffline(true); break; }
        q.err = (e && e.message) || (e && e.code) || 'Lỗi'; await saveQ();

    // Bản mới đang hiệu lực thì các bản khác cùng tài liệu thôi hiệu lực (máy chủ chỉ trả về bản mới)

    upsert(D.taiLieu, d.taiLieu);

  if (Array.isArray(d.taiLieu)) { const ids = d.taiLieu.map((x) => x.id); const ma = d.taiLieu[0] && d.taiLieu[0].maTL; D.taiLieu = D.taiLieu.filter((x) => x.maTL !== ma && ids.indexOf(x.id) < 0).concat(d.taiLieu); }

  if (action === 'wireDelete') D.dayDien = D.dayDien.filter((x) => x.id !== d.id);
  if (d.mach) { D.machDien = D.machDien || []; upsert(D.machDien, d.mach); }
  if (d.chuyen && !Array.isArray(d.chuyen)) { D.chuyen = D.chuyen || []; upsert(D.chuyen, d.chuyen); }
  if (d.machDien) D.machDien = d.machDien;
  if (d.dongTo) D.dongTo = d.dongTo;
  if (action === 'circuitDelete') D.machDien = (D.machDien || []).filter((x) => x.id !== d.id);
  if (d.cauHinh) upsert(D.cauHinh, d.cauHinh);

  if (d.chaySP) { D.chaySP = D.chaySP || []; upsert(D.chaySP, d.chaySP); }
  if (d.tinhDauIn) { D.tinhDauIn = D.tinhDauIn || []; upsert(D.tinhDauIn, d.tinhDauIn); }
  if (action === 'calcDelete') D.tinhDauIn = (D.tinhDauIn || []).filter((x) => x.id !== d.id);
  if (d.ghiChuPLC) { D.ghiChuPLC = D.ghiChuPLC || []; upsert(D.ghiChuPLC, d.ghiChuPLC); }
  if (action === 'plcNoteDelete') D.ghiChuPLC = (D.ghiChuPLC || []).filter((x) => x.id !== d.id);
  if (d.sanPham) { D.sanPham = D.sanPham || []; if (d.sanPham.hoatDong === 0) D.sanPham = D.sanPham.filter((x) => x.id !== d.sanPham.id); else upsert(D.sanPham, d.sanPham); }

    if (l.hoatDong) D.chuyenSP.push({ id: l.id, chuyen: l.chuyen, sanPham: l.sanPham });

const COT_DAY = [['soDay', 'Số dây', '线号'], ['banVe', 'Bản vẽ', '图号'], ['to', 'Tờ', '图页'], ['tuDiem', 'Từ điểm', '起点'], ['denDiem', 'Đến điểm', '终点'],

  ['kepAm', 'Hàng kẹp (−)', '端子−', ['Hàng kẹp (-)']], ['diemVe', 'Chân về', '回线端', ['Điểm về']], ['dayVe', 'Dây về (−)', '回线', ['Dây về (-)', 'Dây về']], ['cauChiVe', 'Cầu chì dây về', '回线保险丝', ['Cầu chì về']],

const COT_DT = [['banVe', 'Bản vẽ', '图号'], ['to', 'Tờ', '图页'], ['dai', 'Dòng', '行号', ['Dải dòng']], ['tuDong', 'Từ dòng', '起始行'], ['denDong', 'Đến dòng', '结束行'],

function tachFileDay(sheets, doc) {
  const kq = { rows: [], mach: [], dongTo: [], boQua: [] };
  sheets.forEach((sh) => {

    if (mM.indexOf('ten') >= 0 && ['kepDuong', 'nguon', 'den'].some((k) => mM.indexOf(k) >= 0)) { kq.mach = kq.mach.concat(lay(mM)); return; }
    const mD = h.map((v) => nhanCotTheo(v, COT_DT));

}

// Đọc mọi sheet của .xlsx, giữ đúng số dòng (để "Mở bảng" đến đúng dòng trong Excel)
async function docXlsxAll(buf) {
  const f = await giaiNen(buf), dp = new DOMParser(), xml = (k) => f[k] ? dp.parseFromString(f[k], 'application/xml') : null;
  const ssDoc = xml('xl/sharedStrings.xml');

    const d = xml(sh.file); if (!d) continue;
    const rows = [];
    Array.from(d.getElementsByTagName('row')).forEach((r) => {
      const o = [];
      Array.from(r.getElementsByTagName('c')).forEach((c) => {
        const ref = c.getAttribute('r') || '', col = ref.replace(/\d+/g, '').split('').reduce((s, ch) => s * 26 + ch.charCodeAt(0) - 64, 0) - 1, t = c.getAttribute('t');

        o[col >= 0 ? col : o.length] = String(val === undefined || val === null ? '' : val).trim();
      });
      for (let i = 0; i < o.length; i++) if (o[i] === undefined) o[i] = '';
      while (o.length && o[o.length - 1] === '') o.pop();
      if (o.length) rows[Number(r.getAttribute('r') || rows.length + 1) - 1] = o;
    });
    for (let i = 0; i < rows.length; i++) if (!rows[i]) rows[i] = [];
    if (rows.some((r) => r.length)) out.push({ name: sh.name, rows });
  }
  if (!out.length) throw new Error('File không có dữ liệu · 文件没有数据');
  return out;
}
function chuanBiTim(sheets) { sheets.forEach((s) => { s.n = s.rows.map((r) => norm(r.join(' \u0001 '))); }); return sheets; }
// Nạp bảng của mọi chuyền: có bản bóc tách trong máy thì dùng ngay, chưa có thì tải tệp về rồi đọc
async function plcNap(cv) {
  const b = dsBang().filter((x) => !cv || x.chuyen === cv);
  for (const x of b) {
    const doc = tlHienHanh(x.maTL); if (!doc || PLC.dang[x.chuyen]) continue;
    if (PLC.nap[x.chuyen] && PLC.nap[x.chuyen].docId === doc.id) continue;
    PLC.dang[x.chuyen] = 1; delete PLC.loi[x.chuyen]; veCT();
    try {
      let sheets = await store.get('plc:' + doc.id, null);
      if (!sheets) {
        const { blob } = await layBlob(doc.id);
        sheets = await docXlsxAll(await blob.arrayBuffer());
        await store.set('plc:' + doc.id, sheets);
        const cu = await store.get('plcIdx', {}); if (cu[x.chuyen] && cu[x.chuyen] !== doc.id) await store.del('plc:' + cu[x.chuyen]);
        cu[x.chuyen] = doc.id; await store.set('plcIdx', cu);
      }
      PLC.nap[x.chuyen] = { docId: doc.id, ten: doc.tenTep, pb: doc.phienBan, sheets: chuanBiTim(sheets) };
    } catch (e) { PLC.loi[x.chuyen] = e; }
    delete PLC.dang[x.chuyen]; veCT();
  }
}
// Ô trông như địa chỉ PLC (X1002, M600, D120, Y1F, B0A…) hoặc chỉ là số — không phải chú thích
const laDiaChi = (v) => /^[A-Z]{1,3}\d[0-9A-F.]*$/i.test(String(v).trim()) || /^[-+]?\d+(\.\d+)?$/.test(String(v).trim());
// Chú thích của ô tìm được: ô chữ gần nhất bên phải, không có thì bên trái
const laChu = (v) => v && !laDiaChi(v) && /[A-Za-z\u4e00-\u9fff]/.test(v);   // "1#", "3.5" không tính là chú thích
function moTa(row, ci) {
  for (let i = ci + 1; i < Math.min(row.length, ci + 4); i++) if (laChu(row[i])) return row[i];
  for (let i = ci - 1; i >= Math.max(0, ci - 3); i--) if (laChu(row[i])) return row[i];
  return '';
}
// Tra ĐÚNG TÊN: gõ M570 chỉ ra ô có đúng "M570" (không ra M5701, M57…); không phân biệt hoa thường, bỏ dấu cách.
// loc.cv = một chuyền; bỏ trống khi tìm ở ô Tìm chung (mọi chuyền). Dòng trùng nội dung chỉ giữ một.
const chuanDC = (v) => String(v || '').toUpperCase().replace(/\s+/g, '');
function plcTim(q, loc, toiDa) {
  const qn = norm(chuanDC(q)); if (!qn) return [];
  const out = [], daCo = {};
  Object.keys(PLC.nap).forEach((cv) => {
    if (loc.cv && loc.cv !== cv) return;
    PLC.nap[cv].sheets.forEach((sh, si) => {
      sh.n.forEach((rn, ri) => {
        if (rn.indexOf(qn) < 0) return;
        const row = sh.rows[ri], ci = row.findIndex((v) => v && norm(chuanDC(v)) === qn);
        if (ci < 0) return;
        const mt = moTa(row, ci), k = cv + '|' + cuaSo(row, ci).map((x) => x[1]).join('|');
        if (daCo[k]) return; daCo[k] = 1;
        out.push({ cv, si, ri, ci, diem: mt ? 0 : 1, mt });
      });
    });
  });
  out.sort((a, b) => a.diem - b.diem);
  return out.slice(0, toiDa || 100);

  plcTrang: (b) => plcMo(b.dataset.cv, Number(b.dataset.si), Number(b.dataset.ri), -1), plcThuLai: () => { PLC.loi = {}; plcNap(); },
  tsCompare, lines: linesForm, lineEdit: (b) => lineEdit(b.dataset.id), lineSave: (b) => lineSave(b.dataset.id), lineOff: (b) => lineSave(b.dataset.id, true),
  timLoai: (b) => { S.timLoai = b.dataset.v; render(); },
  plcDiaChi: (b) => { S.pq = b.dataset.dc; const i = $('#pq'); if (i) i.value = S.pq; veKqPLC(); },
  goTinh: (b) => { S.tcv = b.dataset.cv; try { localStorage.setItem('gctl_tcv', S.tcv); } catch (e) { /* bỏ qua */ } go('tinh'); },
  goPLC: (b) => { S.pcv = b.dataset.cv; S.pq = b.dataset.dc; try { localStorage.setItem('gctl_pcv', S.pcv); } catch (e) { /* bỏ qua */ } go('ct'); },
  tcvChon: (b) => { S.tcv = b.dataset.cv; try { localStorage.setItem('gctl_tcv', S.tcv); } catch (e) { /* bỏ qua */ } render(); },
  tSave: (b) => tSave(b.dataset.cv), tDel: (b) => tDel(b.dataset.id), tDungLai: (b) => tDungLai(b.dataset.id),
  qSend: () => { S.Q.forEach((q) => { q.err = ''; }); guiHangCho(true).then(render); },
  qDrop: async (b) => { if (!window.confirm('Bỏ việc chờ gửi này? · 删除此待发送项？')) return; S.Q.splice(Number(b.dataset.i), 1); await saveQ(); await refresh(); render(); },
  export: xuatExcel, groups: groupsForm, audit: auditView, pinChange: pinForm,
  pinSave: async () => {
    try { const d = await api('changePin', { cu: $('#pCu').value, moi: $('#pMoi').value }); S.tk = d.token; await store.set('tk', S.tk); closeSheet(); tt('daLuu'); }
    catch (e) { toast(errMsg(e), true); }
  },
  groupAdd: async () => {
    const ten = $('#gTen').value.trim(); if (!ten) return;
    const r = await ghi('groupSave', { ten, tenZh: $('#gZh').value.trim() }, 'Nhóm ' + ten);
    if (r.ok && !r.queued) { tt('daLuu'); groupsForm(); }
  },
  groupOff: async (b) => {
    const n = nhomObj(b.dataset.id); if (!n || !confirmXoa()) return;
    try { await api('groupSave', { id: n.id, ten: n.ten, tenZh: n.tenZh, hoatDong: 0 }, { opId: newOp() }); S.data.nhom = S.data.nhom.filter((x) => x.id !== n.id); await saveSnap(); groupsForm(); }
    catch (e) { toast(errMsg(e), true); }
  },
  simOff: () => { S.simOff = !S.simOff; if (!S.simOff) { setOffline(false); guiHangCho(); } else setOffline(true); render(); },
  logout: () => { if (S.Q.length && !window.confirm('Còn việc chờ gửi, vẫn đăng xuất? · 还有待发送项，仍要退出？')) return; logout(); },
  apiReset: async () => { await store.del('api'); S.api = ''; logout(); },
  setApi: async () => {
    const v = $('#apiIn').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)) { $('#lErr').innerHTML = L('Link phải dạng https://script.google.com/…/exec', '链接格式应为 https://script.google.com/…/exec'); return; }
    S.api = v; await store.set('api', v); render();
  }
};
document.addEventListener('click', (e) => {
  const k = e.target.closest('[data-k]');
  if (k && k.closest('#pinPad')) { pinKey(k.dataset.k); return; }
  const tab = e.target.closest('.tab[data-v]');
  if (tab) { go(tab.dataset.v); return; }
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) { if (a.tagName === 'LABEL') return; e.preventDefault(); ACT[a.dataset.act](a); }
});
window.addEventListener('online', () => { setOffline(false); guiHangCho(); });
window.addEventListener('offline', () => setOffline(true));
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.tk) guiHangCho(); });

// ============ Nối với app Bảo dưỡng (CMMS) bằng mã chuyền / mã máy (v1.8) ============
// Hai app vẫn đăng nhập riêng, không dữ liệu nào chạy sang app kia: chỉ là đường link mở đúng màn.
//   App này nhận   ?tim=VKY01   → mở màn Tìm với sẵn chữ VKY01
//                  &cmms=<link> → nhớ địa chỉ app Bảo dưỡng trên máy này
//   App Bảo dưỡng nhận ?m=VKY01 (đang dùng cho tem QR) và &gc=<link app này>
// Địa chỉ lưu theo TỪNG MÁY (localStorage), không lên Google Sheet.
const linkHopLe = (u) => /^https?:\/\//i.test(String(u || '')) || (IS_DEMO && /^file:\/\//i.test(String(u || '')));
function cmmsUrl() { try { const u = localStorage.getItem('gctl_cmms') || ''; return linkHopLe(u) ? u : ''; } catch (e) { return ''; } }
function datCmms(u) { try { if (u) localStorage.setItem('gctl_cmms', u); else localStorage.removeItem('gctl_cmms'); } catch (e) { /* bỏ qua */ } }
const urlMinh = () => location.href.split('#')[0].split('?')[0];
// App này ghi chuyền là "01", "09"… (hiện "Chuyền 01"); app Bảo dưỡng ghi "VKY01". Mã toàn số thì thêm VKY
// và đủ hai chữ số; mã đã có chữ (VKY01, M001, H2506) giữ nguyên.
const maCmms = (ma) => { const m = String(ma || '').trim().replace(/^chuy[eề]n\s*/i, ''); return /^\d{1,3}$/.test(m) ? 'VKY' + m.padStart(2, '0') : m; };
function linkCmms(ma) {
  const b = cmmsUrl(), m = maCmms(ma);
  if (!b || !m) return '';
  try { const u = new URL(b); u.searchParams.set('m', m); u.searchParams.set('gc', urlMinh()); return u.href; } catch (e) { return ''; }
}
// Nút / chip mở thẳng màn đó bên app Bảo dưỡng. Chưa nối thì không hiện gì.
const nutCmms = (ma) => { const h = linkCmms(ma); return h ? `<a class="btn sm ghost cmms" href="${esc(h)}" target="_blank" rel="noopener">${IC.link}${L('Mở bên app Bảo dưỡng', '在保养APP中打开')}</a>` : ''; };
const chipMay = (ma) => { const h = linkCmms(ma); return h ? `<a class="chip cmms" href="${esc(h)}" target="_blank" rel="noopener">${T.maMay[0]}: ${esc(ma)} ↗</a>` : `<span class="chip">${T.maMay[0]}: ${esc(ma)}</span>`; };
function cmmsForm() {
  sheet(L('Nối với app Bảo dưỡng', '连接保养APP'), `<div class="card">
    <p class="muted" style="margin:0 0 10px">${L('Dán địa chỉ app Bảo dưỡng (CMMS) đang mở trên điện thoại này. Từ đó mã chuyền, mã máy trong ghi chú bấm vào là mở thẳng màn đó bên app Bảo dưỡng. Chỉ lưu trên máy này.',
      '粘贴本手机上保养APP（CMMS）的地址。之后备注中的产线、设备编号可直接点开保养APP对应页面。仅保存在本机。')}</p>
    <label class="f"><span class="l">${L('Địa chỉ app Bảo dưỡng', '保养APP地址')}</span><input class="i mono" id="cmmsIn" value="${esc(cmmsUrl())}" placeholder="https://…/B-o-d-ng/" autocomplete="off"></label>
    <div id="cmmsErr" style="color:var(--bad)"></div></div>
    <div class="btns"><button class="btn" data-act="cmmsLuu">${L(T.luu ? T.luu[0] : 'Lưu', T.luu ? T.luu[1] : '保存')}</button>
    ${cmmsUrl() ? `<button class="btn bad" data-act="cmmsBo">${L('Bỏ nối', '取消连接')}</button>` : ''}</div>`);
}
Object.assign(ACT, {
  cmmsForm,
  cmmsLuu: () => {
    const v = $('#cmmsIn').value.trim();
    if (!linkHopLe(v)) { $('#cmmsErr').textContent = 'Địa chỉ phải bắt đầu bằng https:// · 地址须以 https:// 开头'; return; }
    datCmms(v); closeSheet(); toast(L('Đã nối với app Bảo dưỡng', '已连接保养APP')); render();
  },
  cmmsBo: () => { datCmms(''); closeSheet(); toast(L('Đã bỏ nối', '已取消连接')); render(); }
});

// ============ Khởi động ============
(async function khoiDong() {
  const m = /[?&]api=([^&]+)/.exec(location.search);
  // App Bảo dưỡng mở sang: ?tim=VKY01 → vào thẳng màn Tìm; &cmms= → nhớ địa chỉ để bấm ngược lại
  try {
    const qs = new URLSearchParams(location.search), cm = qs.get('cmms'), tim = qs.get('tim');
    if (cm && linkHopLe(cm)) datCmms(cm);
    if (tim) { S.q = tim.slice(0, 60); S.view = 'tim'; }
  } catch (e) { /* bỏ qua */ }
  S.api = await store.get('api', '');
  if (m && !(typeof API_URL === 'string' && API_URL)) { S.api = decodeURIComponent(m[1]); await store.set('api', S.api); }
  S.tk = await store.get('tk', '');
  S.Q = await store.get('q', []);
  S.offDocs = await store.get('offDocs', {});
  S.lanCuoi = await store.get('lanCuoi', 0);
  if (S.tk) { S.data = await store.get('snap', null); render(); await guiHangCho(); await refresh(); if (S.data) plcNap(); }
  else render();
  if (!IS_DEMO && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
